# CI: draait bij elke pull request naar main.
# Twee checks: sqlfluff-lint en een volledige dbt build (run + test)
# tegen een geïsoleerd ci-schema op de Databricks SQL warehouse.
name: ci

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    # env op job-niveau: de dbt-templater van sqlfluff heeft bij het
    # compileren ook een warehouse-verbinding nodig, niet alleen dbt build
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint SQL (sqlfluff)
        run: cd transform && uv run sqlfluff lint transform

      - name: DBT Check
        run: uv run dbt debug

      - name: dbt build — ci-schema
        working-directory: transform
        run: uv run dbt build --target ci
