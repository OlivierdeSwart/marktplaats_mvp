# Ingestion-orchestratie: dlt draait op de GitHub-runner (die heeft publieke
# internet-egress — Databricks serverless op GCP niet, empirisch vastgesteld),
# en triggert daarna de Databricks-job voor de dbt-transformaties.
name: ingest

on:
  workflow_dispatch: {} # handmatig triggeren (demo)
  schedule:
    - cron: "0 * * * *" # elk uur (UTC)

jobs:
  dlt-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: dlt pipeline — API naar Delta in GCS
        working-directory: ingestion
        env:
          DESTINATION__FILESYSTEM__CREDENTIALS: ${{ secrets.GCS_SA_KEY }}
        run: uv run python marketplace_pipeline.py

      - name: Trigger Databricks-job (dbt)
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          curl -sf -X POST "https://${{ secrets.DATABRICKS_HOST }}/api/2.2/jobs/run-now" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"job_id": 894240576307068}'
