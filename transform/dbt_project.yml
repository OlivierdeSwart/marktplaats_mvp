name: marktplaats
version: "1.0.0"
profile: marktplaats

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

models:
  marktplaats:
    # documentatie uit de yml's landt in Unity Catalog -> voedt Genie
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: silver
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

snapshots:
  marktplaats:
    +schema: silver
